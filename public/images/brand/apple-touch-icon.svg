<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="apple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="apple-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="180" height="180" rx="36" fill="url(#apple-grad)" filter="url(#apple-glow)"/>
  <circle cx="90" cy="90" r="70" stroke="white" stroke-width="3" fill="none" opacity="0.2"/>
  <circle cx="90" cy="90" r="35" fill="url(#apple-grad)" filter="url(#apple-glow)"/>
  <g stroke="white" stroke-width="3" fill="white">
    <circle cx="90" cy="40" r="8"/>
    <circle cx="140" cy="65" r="8"/>
    <circle cx="140" cy="115" r="8"/>
    <circle cx="90" cy="140" r="8"/>
    <circle cx="40" cy="115" r="8"/>
    <circle cx="40" cy="65" r="8"/>
  </g>
</svg>