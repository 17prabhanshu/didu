<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="60" stroke="url(#grad)" stroke-width="3" fill="none" filter="url(#glow)"/>
  
  <!-- Inner hexagon -->
  <polygon points="64,8 112,26 112,62 64,106 16,62 16,26" fill="url(#grad)" opacity="0.15"/>
  
  <!-- Node network -->
  <g stroke="url(#grad)" stroke-width="2" fill="white">
    <!-- Center node -->
    <circle cx="64" cy="64" r="10" filter="url(#glow)"/>
    
    <!-- Orbit nodes -->
    <circle cx="64" cy="20" r="6"/>
    <circle cx="100" cy="40" r="6"/>
    <circle cx="100" cy="88" r="6"/>
    <circle cx="64" cy="108" r="6"/>
    <circle cx="28" cy="88" r="6"/>
    <circle cx="28" cy="40" r="6"/>
    
    <!-- Connection lines -->
    <line x1="64" y1="30" x2="64" y2="54" stroke-width="1.5" opacity="0.6"/>
    <line x1="72" y1="50" x2="92" y2="44" stroke-width="1.5" opacity="0.6"/>
    <line x1="72" y1="78" x2="92" y2="84" stroke-width="1.5" opacity="0.6"/>
    <line x1="64" y1="98" x2="64" y2="74" stroke-width="1.5" opacity="0.6"/>
    <line x1="44" y1="78" x2="36" y2="84" stroke-width="1.5" opacity="0.6"/>
    <line x1="44" y1="50" x2="36" y2="44" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Outer ring connections -->
    <line x1="64" y1="26" x2="64" y2="8" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
    <line x1="94" y1="38" x2="116" y2="22" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
    <line x1="94" y1="90" x2="116" y2="106" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
    <line x1="64" y1="102" x2="64" y2="120" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
    <line x1="34" y1="90" x2="12" y2="106" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
    <line x1="34" y1="38" x2="12" y2="22" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
  </g>
  
  <!-- Pulse rings (animated via CSS) -->
  <circle class="pulse-ring" cx="64" cy="64" r="50" stroke="url(#grad)" stroke-width="1" fill="none" opacity="0.3"/>
  <circle class="pulse-ring" cx="64" cy="64" r="42" stroke="url(#grad)" stroke-width="1" fill="none" opacity="0.2"/>
</svg>