# Dependency Review Configuration
# See: https://github.com/actions/dependency-review-action

# Fail on these severities
fail-on-severity: high

# Allow these licenses (SPDX identifiers)
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - Unicode-DFS-2015
  - WTFPL
  - Zlib
  - CC0-1.0

# Deny these licenses
deny-licenses:
  - GPL-2.0
  - GPL-3.0
  - AGPL-3.0
  - LGPL-2.1
  - LGPL-3.0

# Allow scoped packages from these registries
allow-registries:
  - npmjs.com
  - github.com

# Fail if direct dependencies have known vulnerabilities
fail-on-severity: high

# Include dev dependencies in scan
include-dev-dependencies: true